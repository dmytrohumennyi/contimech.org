<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" font-family="IBM Plex Sans, Segoe UI, Roboto, Arial, sans-serif">
<title>Radio horizon and ground-station diversity for a first-stage hop test (illustrative)</title>
<rect width="960" height="440" fill="#ffffff"/>
<text x="40" y="36" font-size="12" fill="#5a6072" font-family="IBM Plex Mono, Consolas, monospace" letter-spacing="1">GEOMETRY · WHY ONE GROUND STATION IS NOT ENOUGH</text>
<path d="M0 410 Q480 300 960 410 L960 440 L0 440 Z" fill="#e9eae4"/>
<path d="M0 410 Q480 300 960 410" fill="none" stroke="#141a2b" stroke-width="1.2"/>
<path d="M120 372 Q470 30 830 368" fill="none" stroke="#1f3c96" stroke-width="2" stroke-dasharray="7 5"/>
<polygon points="830,368 824,352 836,352" fill="#1f3c96"/>
<text x="470" y="186" text-anchor="middle" font-size="12.5" fill="#1f3c96">first-stage flight: ascent, coast, return</text>
<path d="M90 384 L900 236" stroke="#b4402c" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="905" y="230" font-size="12" fill="#b4402c" text-anchor="end">line of sight of station A, grazing the horizon</text>
<polygon points="640,283 900,236 900,397 640,361" fill="#b4402c" fill-opacity=".08"/>
<text x="700" y="350" font-size="12" fill="#b4402c" text-anchor="middle">shadow of A</text>
<g font-size="12.5" fill="#141a2b">
<rect x="78" y="378" width="24" height="16" fill="#d39319"/><text x="62" y="368" text-anchor="middle">A</text>
<text x="40" y="430" font-size="12" fill="#5a6072">station A · launch site · tracking dish</text>
<rect x="852" y="372" width="24" height="16" fill="#d39319"/><text x="890" y="362">B</text>
<text x="920" y="430" font-size="12" fill="#5a6072" text-anchor="end">station B · near landing zone</text>
</g>
<g font-family="IBM Plex Mono, Consolas, monospace" font-size="12.5" fill="#141a2b">
<rect x="40" y="56" width="420" height="58" fill="#ffffff" stroke="#d8d9d2"/>
<text x="56" y="80">d ≈ 4.12 (√h_A + √h_V)  km, h in m, k = 4/3</text>
<text x="56" y="102">d = 130 km, h_A = 10 m  →  h_V ≥ ≈ 806 m</text>
</g>
<text x="940" y="22" text-anchor="end" font-size="11" fill="#8a8f9c" font-family="IBM Plex Mono, Consolas, monospace">ILLUSTRATIVE · NOT TO SCALE</text>
</svg>
