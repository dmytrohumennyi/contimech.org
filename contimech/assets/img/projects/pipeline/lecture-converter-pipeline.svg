<rect width="1200" height="660" rx="34" fill="url(#bg)"/>
<text x="70" y="82" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0E6E63" letter-spacing="2">LOCAL PROCESSING PIPELINE</text>
<text x="70" y="126" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#18252b">One command. Four resumable stages.</text>
<g filter="url(#sh)">
