</g>
<g font-family="Arial, sans-serif"><g fill="#0E6E63" font-size="18" font-weight="700"><text x="96" y="240">01 · PREPARE</text><text x="376" y="240">02 · AUDIO</text><text x="656" y="240">03 · ASR</text><text x="936" y="240">04 · MARKDOWN</text></g>
<g fill="#18252b" font-size="26" font-weight="700"><text x="96" y="286">Video input</text><text x="376" y="286">ffmpeg</text><text x="656" y="286">faster-whisper</text><text x="936" y="286">Structured text</text></g>
<g fill="#5e6b68" font-size="17"><text x="96" y="328">Create work folder</text><text x="96" y="358">Copy / move source</text><text x="96" y="388">Safe arbitrary names</text><text x="376" y="328">16 kHz · mono</text><text x="376" y="358">64 kbps MP3</text><text x="376" y="388">Optimized for ASR</text><text x="656" y="328">VAD filtering</text><text x="656" y="358">Language detection</text><text x="656" y="388">GPU or CPU</text><text x="936" y="328">YAML front-matter</text><text x="936" y="358">Paragraph grouping</text><text x="936" y="388">Timestamps + notes</text></g></g>
