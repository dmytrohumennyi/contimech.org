<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Embedded Linux inertial control platform architecture</title>
<desc id="d">Component architecture showing an NXP i.MX93 Alpine Linux compute board coordinating deterministic control MCUs, sensors, CAN FD, GPIO, Ethernet service and update path.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfe"/><stop offset="1" stop-color="#eef5fa"/></linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28679b"/></marker>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#21364a}.h{font-weight:800;font-size:26px}.s{font-size:17px}.m{font-size:15px;fill:#506575}.tiny{font-size:13px;fill:#607585}.box{fill:#fff;stroke:#c6d7e5;stroke-width:2}.core{fill:#e8f1fa;stroke:#7ea7c8;stroke-width:2}.linux{fill:#1f5d8f;stroke:#174c76;stroke-width:2}.linuxText{fill:#fff}.iface{fill:#eff8f6;stroke:#75b7ad;stroke-width:2}.line{stroke:#28679b;stroke-width:3;fill:none;marker-end:url(#arr)}.bi{stroke:#28679b;stroke-width:3;fill:none;marker-start:url(#arr);marker-end:url(#arr)}
  </style>
</defs>
<rect x="1" y="1" width="1198" height="678" rx="28" fill="url(#bg)" stroke="#d3e0ea"/>
<text x="46" y="58" class="h">Architecture — Linux services around deterministic control</text>
<text x="46" y="88" class="m">The application processor provides orchestration, serviceability and updates. Real-time loops remain on dedicated MCUs.</text>

<!-- Service network -->
<g><rect x="45" y="145" width="190" height="126" rx="18" class="box"/><text x="140" y="181" text-anchor="middle" class="s" font-weight="700">Service network</text><text x="140" y="214" text-anchor="middle" class="m">100BASE-TX Ethernet</text><text x="140" y="239" text-anchor="middle" class="m">SSH / diagnostics</text></g>

<!-- Linux board -->
<g><rect x="318" y="124" width="430" height="210" rx="22" class="linux"/><text x="533" y="164" text-anchor="middle" class="h linuxText">Linux Compute Board</text><text x="533" y="194" text-anchor="middle" class="s linuxText">NXP i.MX93 · Alpine Linux aarch64 rootfs</text>
<rect x="342" y="220" width="115" height="72" rx="13" fill="#fff" opacity=".96"/><text x="399" y="247" text-anchor="middle" class="m" font-weight="700">App service</text><text x="399" y="270" text-anchor="middle" class="tiny">state / routing</text>
<rect x="468" y="220" width="115" height="72" rx="13" fill="#fff" opacity=".96"/><text x="525" y="247" text-anchor="middle" class="m" font-weight="700">Diagnostics</text><text x="525" y="270" text-anchor="middle" class="tiny">logs / health</text>
<rect x="594" y="220" width="130" height="72" rx="13" fill="#fff" opacity=".96"/><text x="659" y="247" text-anchor="middle" class="m" font-weight="700">Update manager</text><text x="659" y="270" text-anchor="middle" class="tiny">A/B + rollback</text></g>

<!-- External service boxes -->
<g><rect x="825" y="145" width="320" height="126" rx="18" class="box"/><text x="985" y="181" text-anchor="middle" class="s" font-weight="700">Field service / integration</text><text x="985" y="211" text-anchor="middle" class="m">Key-based SSH · SFTP / release bundle</text><text x="985" y="237" text-anchor="middle" class="m">gdbserver · tcpdump · can-utils</text></g>

<!-- Middle control layer -->
<g><rect x="275" y="420" width="570" height="155" rx="22" class="core"/><text x="560" y="458" text-anchor="middle" class="h">Deterministic control electronics</text>
<rect x="303" y="485" width="158" height="62" rx="12" class="box"/><text x="382" y="512" text-anchor="middle" class="s" font-weight="700">Control MCU</text><text x="382" y="535" text-anchor="middle" class="tiny">real-time loop</text>
<rect x="480" y="485" width="158" height="62" rx="12" class="box"/><text x="559" y="512" text-anchor="middle" class="s" font-weight="700">I/O MCU</text><text x="559" y="535" text-anchor="middle" class="tiny">safety / GPIO</text>
<rect x="657" y="485" width="160" height="62" rx="12" class="box"/><text x="737" y="512" text-anchor="middle" class="s" font-weight="700">Power supervisor</text><text x="737" y="535" text-anchor="middle" class="tiny">reset / watchdog</text></g>

<!-- Peripherals -->
<g><rect x="45" y="455" width="170" height="95" rx="16" class="iface"/><text x="130" y="487" text-anchor="middle" class="s" font-weight="700">Actuator / device</text><text x="130" y="515" text-anchor="middle" class="m">CAN FD</text><text x="130" y="538" text-anchor="middle" class="tiny">commands / faults</text></g>
<g><rect x="890" y="401" width="255" height="78" rx="16" class="iface"/><text x="1018" y="432" text-anchor="middle" class="s" font-weight="700">IMU / inertial sensors</text><text x="1018" y="458" text-anchor="middle" class="m">SPI / interrupt</text></g>
<g><rect x="890" y="500" width="255" height="78" rx="16" class="iface"/><text x="1018" y="531" text-anchor="middle" class="s" font-weight="700">GNSS / barometer</text><text x="1018" y="557" text-anchor="middle" class="m">UART / I²C</text></g>

<!-- Arrows -->
<path d="M235 208 H318" class="bi"/><text x="276" y="193" text-anchor="middle" class="tiny">Ethernet</text>
<path d="M748 208 H825" class="bi"/><text x="786" y="193" text-anchor="middle" class="tiny">SSH / update</text>
<path d="M443 334 V420" class="bi"/><text x="412" y="383" class="tiny">CAN FD</text>
<path d="M623 334 V420" class="bi"/><text x="636" y="383" class="tiny">GPIO</text>
<path d="M215 503 H275" class="bi"/>
<path d="M845 466 H890" class="bi"/>
<path d="M845 539 H890" class="bi"/>

<!-- footer note -->
<rect x="45" y="610" width="1100" height="42" rx="12" fill="#fff" stroke="#d4e1ea"/><text x="65" y="636" class="m"><tspan font-weight="700">Design rule:</tspan> Linux may coordinate, log and update the system; deterministic actuation and safety timing do not depend on Linux scheduling.</text>
</svg>
