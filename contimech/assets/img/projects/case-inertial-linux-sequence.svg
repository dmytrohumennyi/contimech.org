<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">Embedded Linux inertial platform sequence diagram</title>
<desc id="d">Sequence diagram showing boot, CAN and GPIO initialization, status collection, deterministic MCU action, diagnostics and SSH update flow.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfe"/><stop offset="1" stop-color="#eef5fa"/></linearGradient>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28679b"/></marker>
  <style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#21364a}.h{font-weight:800;font-size:26px}.m{font-size:15px;fill:#506575}.head{fill:#1f5d8f}.headText{fill:#fff;font-size:17px;font-weight:800}.life{stroke:#91a8b8;stroke-width:2;stroke-dasharray:7 8}.msg{stroke:#28679b;stroke-width:3;fill:none;marker-end:url(#arr)}.reply{stroke:#4f7f9e;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#arr)}.n{fill:#1f5d8f}.nt{fill:#fff;font-size:13px;font-weight:800}</style>
</defs>
<rect x="1" y="1" width="1198" height="678" rx="28" fill="url(#bg)" stroke="#d3e0ea"/>
<text x="46" y="58" class="h">Typical component interaction</text>
<text x="46" y="88" class="m">A native Linux service handles the micro-ROS-class gateway workload with SocketCAN and libgpiod; real-time execution remains below it.</text>

<g><rect x="105" y="125" width="205" height="52" rx="12" class="head"/><text x="207" y="158" text-anchor="middle" class="headText">Linux application</text>
<rect x="365" y="125" width="205" height="52" rx="12" class="head"/><text x="467" y="158" text-anchor="middle" class="headText">CAN / GPIO layer</text>
<rect x="625" y="125" width="205" height="52" rx="12" class="head"/><text x="727" y="158" text-anchor="middle" class="headText">Control MCU</text>
<rect x="885" y="125" width="205" height="52" rx="12" class="head"/><text x="987" y="158" text-anchor="middle" class="headText">Peripheral device</text>
<path d="M207 177 V625" class="life"/><path d="M467 177 V625" class="life"/><path d="M727 177 V625" class="life"/><path d="M987 177 V625" class="life"/></g>

<!-- 1 --> <circle cx="60" cy="222" r="17" class="n"/><text x="60" y="227" text-anchor="middle" class="nt">1</text><path d="M207 222 H467" class="msg"/><text x="337" y="210" text-anchor="middle" class="m">Initialize service + interfaces</text>
<!-- 2 --> <circle cx="60" cy="292" r="17" class="n"/><text x="60" y="297" text-anchor="middle" class="nt">2</text><path d="M467 292 H727" class="msg"/><text x="597" y="280" text-anchor="middle" class="m">Configure CAN filters / GPIO roles</text>
<!-- 3 --> <circle cx="60" cy="362" r="17" class="n"/><text x="60" y="367" text-anchor="middle" class="nt">3</text><path d="M207 362 H727" class="msg"/><text x="467" y="350" text-anchor="middle" class="m">Request state / command operation</text>
<!-- 4 --> <circle cx="60" cy="432" r="17" class="n"/><text x="60" y="437" text-anchor="middle" class="nt">4</text><path d="M727 432 H987" class="msg"/><text x="857" y="420" text-anchor="middle" class="m">Deterministic actuation</text>
<!-- 5 --> <circle cx="60" cy="502" r="17" class="n"/><text x="60" y="507" text-anchor="middle" class="nt">5</text><path d="M987 502 H727" class="reply"/><path d="M727 520 H207" class="reply"/><text x="857" y="490" text-anchor="middle" class="m">State / fault</text><text x="467" y="545" text-anchor="middle" class="m">Status + diagnostics</text>
<!-- 6 --> <circle cx="60" cy="585" r="17" class="n"/><text x="60" y="590" text-anchor="middle" class="nt">6</text><path d="M207 585 H467" class="msg"/><text x="337" y="573" text-anchor="middle" class="m">Log / persist / expose service state</text>

<rect x="730" y="568" width="360" height="56" rx="14" fill="#eff8f6" stroke="#75b7ad"/><text x="910" y="592" text-anchor="middle" class="m" font-weight="700">Independent service path</text><text x="910" y="614" text-anchor="middle" class="m">SSH configuration, trace capture, signed update</text>
</svg>
