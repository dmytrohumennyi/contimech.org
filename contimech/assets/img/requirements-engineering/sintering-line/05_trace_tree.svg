6" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="195.5674" x="485" y="286.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.9844" x="495" y="309.292">HZ-03</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="175.5674" x="495" y="325.5889">Uncontrolled combustion</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="101.9512" x="495" y="341.8857">at the exhaust</text></g><!--entity HZ1--><g class="entity" data-entity="HZ1" data-source-line="155" data-uid="ent0005" id="entity_HZ1"><rect fill="#F2E7D2" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="175.3125" x="169.5" y="286.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="42.9844" x="179.5" y="309.292">HZ-01</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="155.3125" x="179.5" y="325.5889">Explosive atmosphere</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="89.5098" x="179.5" y="341.8857">in the muffle</text></g><!--entity F3--><g class="entity" data-entity="F3" data-source-line="156" data-uid="ent0006" id="entity_F3"><rect fill="#D8EBE7" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="191.4385" x="592.5" y="416.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="64.709" x="602.5" y="439.292">Finding 3</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171.4385" x="602.5" y="455.5889">A maintenance task was</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="117.8584" x="602.5" y="471.8857">a safety function</text></g><!--entity F4--><g class="entity" data-entity="F4" dat