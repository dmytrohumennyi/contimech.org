1934" x="23" y="601.8857">H2 fraction in-line</text></g><!--entity R3--><g class="entity" data-entity="R3" data-source-line="161" data-uid="ent0010" id="entity_R3"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="180.2207" x="481" y="675.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="142.5771" x="491" y="698.292">SNTR-HWR-EXH-010</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="143.7666" x="491" y="714.5889">Differential pressure</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="160.2207" x="491" y="730.8857">transmitter, accessible</text></g><!--entity V1--><g class="entity" data-entity="V1" data-source-line="163" data-uid="ent0011" id="entity_V1"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="217.0322" x="696.5" y="683.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="193.5869" x="706.5" y="706.292">Test: exhaust progressively</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="197.0322" x="706.5" y="722.5889">restricted during production</text></g><!--entity V2--><g class="entity" data-entity="V2" data-source-line="164" data-uid="ent0012" id="entity_V2"><rect fill="#FFFFFF" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="244.4512" x="449" y="804.2969"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="224.4512" x="459" y="827.292">Analysis + OP-02: accumulation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144.498" x="459" y="843.5889">rate over one month</text></g><g class="entity" data-entity="GMN24" data-source-line="179" data-uid="ent0025" id="entity_GMN24