<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="891px" preserveAspectRatio="none" style="width:1469px;height:891px;background:#FFFFFF;" version="1.1" viewBox="0 0 1469 891" width="1469px" zoomAndPan="magnify"><title>Fig. 3 Stop function separation (Finding 2)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="336.9023" x="564.8772" y="32.9951">Fig. 3 Stop function separation (Finding 2)</text><rect fill="none" height="20.9531" style="stroke:none;stroke-width:1;" width="1436.6567" x="15" y="50.042"/><ellipse cx="399.7485" cy="85.9951" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="166.9414" x="316.2778" y="115.9951"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="146.9414" x="326.2778" y="137.1338">actuate emergency stop</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="200.2402" x="299.6284" y="696.7998"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="180.2402" x="309.6284" y="717.9385">inspect, correct, acknowledge</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="183.3945" x="308.0513" y="750.7686"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="163.3945" x="318.0513" y="771.9072">defined recovery sequence</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="124.3828" x="318.0513" y="785.876">[SNTR-SYS-REC-030]</text><path d="M20,808.7061 L20,879.2373 A0,0 0 0 0 20,879.2373 L368.7485,879.2373 A0,0 0 0 0 368.7485,879.2373 L368.7485,847.9717 L388.7485,843.9717 L368.7485,839.9717 L368.7485,818.7061 L358.7485,808.7061 L20,808.7061 A0,0 0 0 0 20,808.7061" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M358.7485,808.7061 L358.7485,818.7061 L368.7485,818.7061 L358.7485,808.7061" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="256.0962" x="26" y="825.7729">As found: one stop path for everything.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="299.7871" x="26" y="840.9058">The atmosphere valves were normally closed,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="297.4004" x="26" y="856.0386">so the emergency stop cut the protective gas</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="327.7485" x="26" y="871.1714">while the muffle was hot and contained hydrogen.</text><ellipse cx="399.7485" cy="843.9717" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="399.7485" cy="843.9717" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><line style="stroke:#000000;stroke-width:1.5;" x1="15" x2="15" y1="50.042" y2="879.2373"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="140.9199" x="553.1108" y="169.9639"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="120.9199" x="563.1108" y="191.1025">remove drive power</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="79.0215" x="584.0601" y="223.9326"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="59.0215" x="594.0601" y="245.0713">belt stops</text><path d="M757.2729,274.7529 L757.2729,290.8857 L737.2729,294.8857 L757.2729,298.8857 L757.2729,315.0186 A0,0 0 0 0 757.2729,315.0186 L967.9663,315.0186 A0,0 0 0 0 967.9663,315.0186 L967.9663,284.7529 L957.9663,274.7529 L757.2729,274.7529 A0,0 0 0 0 757.2729,274.7529" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M957.9663,274.7529 L957.9663,284.7529 L967.9663,284.7529 L957.9663,274.7529" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="177.582" x="763.2729" y="291.8198">Stop category as assessed.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.6934" x="763.2729" y="306.9526">De-energised is correct here.</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="227.4043" x="509.8687" y="277.9014"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="207.4043" x="519.8687" y="299.04">guard locks release per ISO 13849</text><line style="stroke:#000000;stroke-width:1.5;" x1="503.8687" x2="503.8687" y1="50.042" y2="879.2373"/><polygon fill="#F1F1F1" points="1168.3049,335.0186,1301.2932,335.0186,1313.2932,347.0186,1301.2932,359.0186,1168.3049,359.0186,1156.3049,347.0186,1168.3049,335.0186" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="132.9883" x="1168.3049" y="350.8267">flammable gas present?</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="19.0083" x="1137.2966" y="344.4243">yes</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="13.7017" x="1313.2932" y="344.4243">no</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="191.3398" x="991.4819" y="369.0186"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="154.6523" x="1001.4819" y="390.1572">isolate flammable supply,</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="171.3398" x="1001.4819" y="404.126">both valves, proof of closure</text><path d="M1180.2222,441.374 L1180.2222,449.9404 L1160.2222,453.9404 L1180.2222,457.9404 L1180.2222,466.5068 A0,0 0 0 0 1180.2222,466.5068 L1299.0967,466.5068 A0,0 0 0 0 1299.0967,466.5068 L1299.0967,451.374 L1289.0967,441.374 L1180.2222,441.374 A0,0 0 0 0 1180.2222,441.374" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1289.0967,441.374 L1289.0967,451.374 L1299.0967,451.374 L1289.0967,441.374" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.8745" x="1186.2222" y="458.4409">requires power</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="146.1406" x="1014.0815" y="436.9561"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="126.1406" x="1024.0815" y="458.0947">ESTABLISH inert flow</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="171.1074" x="1001.5981" y="490.9248"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="151.1074" x="1011.5981" y="512.0635">hold muffle overpressure</text><rect fill="#F1F1F1" height="47.9375" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="204.0254" x="985.1392" y="544.8936"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="184.0254" x="995.1392" y="566.0322">UPS carries valve, instruments</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="164.9004" x="995.1392" y="580.001">and safety logic &gt;= 30 min</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="216.3711" x="978.9663" y="612.8311"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="196.3711" x="988.9663" y="633.9697">remain in atmosphere safe state</text><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="126.6992" x="1319.0967" y="369.0186"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="106.6992" x="1329.0967" y="390.1572">hold purged state</text><polygon fill="#F1F1F1" points="1234.7991,652.7998,1246.7991,664.7998,1234.7991,676.7998,1222.7991,664.7998,1234.7991,652.7998" style="stroke:#181818;stroke-width:0.5;"/><line style="stroke:#000000;stroke-width:1.5;" x1="972.9663" x2="972.9663" y1="50.042" y2="879.2373"/><line style="stroke:#000000;stroke-width:1.5;" x1="1449.7959" x2="1449.7959" y1="50.042" y2="879.2373"/><line style="stroke:#181818;stroke-width:1;" x1="399.7485" x2="399.7485" y1="95.9951" y2="115.9951"/><polygon fill="#181818" points="395.7485,105.9951,399.7485,115.9951,403.7485,105.9951,399.7485,109.9951" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="399.7485" x2="399.7485" y1="730.7686" y2="750.7686"/><polygon fill="#181818" points="395.7485,740.7686,399.7485,750.7686,403.7485,740.7686,399.7485,744.7686" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="399.7485" x2="399.7485" y1="798.7061" y2="832.9717"/><polygon fill="#181818" points="395.7485,822.9717,399.7485,832.9717,403.7485,822.9717,399.7485,826.9717" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="623.5708" x2="623.5708" y1="203.9326" y2="223.9326"/><polygon fill="#181818" points="619.5708,213.9326,623.5708,223.9326,627.5708,213.9326,623.5708,217.9326" style="stroke:#181818;stroke-width:1;"/><line style="stroke:#181818;stroke-width:1;" x1="623.57