<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" font-family="IBM Plex Sans, Segoe UI, Roboto, Arial, sans-serif">
<title>UML sequence: fade, horizon loss, takeover and gap fill (illustrative)</title>
<rect width="960" height="620" fill="#ffffff"/>
<text x="40" y="30" font-size="12" fill="#5a6072" font-family="IBM Plex Mono, Consolas, monospace" letter-spacing="1">«SEQUENCE» NO FRAME LEFT BEHIND</text>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#141a2b"/></marker></defs>
<g font-size="12.5" text-anchor="middle" fill="#141a2b">
<rect x="40" y="46" width="140" height="34" fill="#fff" stroke="#1f3c96"/><text x="110" y="68">Onboard recorder</text>
<rect x="210" y="46" width="150" height="34" fill="#fff" stroke="#1f3c96"/><text x="285" y="68">Downlink scheduler</text>
<rect x="410" y="46" width="130" height="34" fill="#fff" stroke="#141a2b"/><text x="475" y="68">Station A</text>
<rect x="590" y="46" width="130" height="34" fill="#fff" stroke="#141a2b"/><text x="655" y="68">Station B</text>
<rect x="770" y="46" width="150" height="34" fill="#fff" stroke="#d39319" stroke-width="1.5"/><text x="845" y="68">Frame merger</text>
</g>
<path d="M110 80 V600 M285 80 V600 M475 80 V600 M655 80 V600 M845 80 V600" stroke="#9aa0ad" stroke-dasharray="4 4"/>
<g stroke="#141a2b" stroke-width="1.2" fill="none" marker-end="url(#b)">
<path d="M285 110 H113"/>
<path d="M285 140 H472"/><path d="M285 140 H652"/>
<path d="M475 160 H842"/><path d="M655 172 H842"/>
<path d="M285 226 H652"/>
<path d="M655 244 H842"/>
<path d="M285 330 H652"/>
<path d="M655 348 H842"/>
<path d="M110 470 H842"/>
</g>
<path d="M285 226 H475" stroke="#b4402c" stroke-width="1.2" stroke-dasharray="5 4"/>
<path d="M466 218 l18 16 M484 218 l-18 16" stroke="#b4402c" stroke-width="2"/>
<rect x="404" y="290" width="142" height="54" fill="#fbecea" stroke="#b4402c"/>
<g font-size="12" fill="#141a2b">
<text x="122" y="104">record every frame, seq n</text>
<text x="300" y="133">frames n … (live)</text>
<text x="488" y="155">frame n, CRC ok</text>
<text x="668" y="186">frame n, CRC ok → keep one copy</text>
<text x="300" y="219">frames n+1 … n+k</text>
<text x="420" y="256" fill="#b4402c">A: plume fade, frames lost</text>
<text x="668" y="258">B still receives n+1 … n+k</text>
<text x="414" y="310" fill="#b4402c">A: vehicle below</text>
<text x="414" y="328" fill="#b4402c">radio horizon</text>
<text x="300" y="323">landing phase</text>
<text x="668" y="362">B carries the stream alone</text>
<rect x="210" y="384" width="660" height="40" fill="#f3f3ef" stroke="#d8d9d2"/>
<text x="226" y="408">if B also loses lock: scheduler enters LOSS OF SIGNAL, recorder keeps every frame</text>
<text x="122" y="462">after landing: full recorder dump</text>
<text x="226" y="500">merger fills every missing sequence number from the dump</text>
<text x="226" y="520">and checks each frame's CRC and timestamp against the live copy</text>
</g>
<rect x="770" y="545" width="160" height="40" fill="#f6e7c4" stroke="#d39319"/>
<text x="850" y="562" text-anchor="middle" font-size="12" fill="#141a2b">archive: every seq</text>
<text x="850" y="578" text-anchor="middle" font-size="12" fill="#141a2b">number present</text>
<text x="40" y="612" font-size="11" fill="#8a8f9c" font-family="IBM Plex Mono, Consolas, monospace">ILLUSTRATIVE</text>
</svg>
