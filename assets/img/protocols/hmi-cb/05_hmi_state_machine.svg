<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="STATE" height="629px" preserveAspectRatio="none" style="width:898px;height:629px;background:#FFFFFF;" version="1.1" viewBox="0 0 898 629" width="898px" zoomAndPan="magnify"><title>ICD-HMI-CB-001 - Fig. 5 HMI link supervision state machine (clause 11)</title><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="560.4922" x="162.1292" y="22.9951">ICD-HMI-CB-001 - Fig. 5 HMI link supervision state machine (clause 11)</text><g id="LinkDown"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="310.4434" x="239.5" y="124.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="239.5" x2="549.9434" y1="150.5938" y2="150.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="68.3389" x="360.5522" y="142.292">LinkDown</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="200.6836" x="244.5" y="166.7324">entry / display link loss indication</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="169.2949" x="244.5" y="180.7012">entry / blank process values</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="290.4434" x="244.5" y="194.6699">Last known values are NOT displayed as current</text></g><path d="M19.5,309.2969 L521.2006,309.2969 A12.5,12.5 0 0 1 533.7006,321.7969 L533.7006,335.5938 L7,335.5938 L7,321.7969 A12.5,12.5 0 0 1 19.5,309.2969" fill="#F1F1F1" style="stroke:#F1F1F1;stroke-width:1;"/><rect fill="none" height="314.5313" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="526.7006" x="7" y="309.2969"/><line style="stroke:#181818;stroke-width:0.5;" x1="7" x2="533.7006" y1="335.5938" y2="335.5938"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="47.8037" x="246.4485" y="327.292">LinkUp</text><g id="LinkUp.Observing"><rect fill="#F1F1F1" height="78.2031" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="182.4863" x="146.06" y="403.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="146.06" x2="328.5463" y1="429.8906" y2="429.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="71.5039" x="201.5512" y="421.5889">Observing</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="108.5391" x="151.06" y="446.0293">renders telemetry</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="162.4863" x="151.06" y="459.998">SAFE_STOP_REQ permitted</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="157.5234" x="151.06" y="473.9668">SET_PARAM not permitted</text></g><g id="LinkUp.Configuring"><rect fill="#F1F1F1" height="64.2344" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="154.0566" x="160.06" y="549.5938"/><line style="stroke:#181818;stroke-width:0.5;" x1="160.06" x2="314.1166" y1="575.8906" y2="575.8906"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81.1973" x="196.4897" y="567.5889">Configuring</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="103.8926" x="165.06" y="592.0293">holds the session</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="134.0566" x="165.06" y="605.998">SET_PARAM permitted</text></g><ellipse cx="237.06" cy="356.5938" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><!--link *start*LinkUp to Observing--><g class="link" data-entity-1="*start*LinkUp" data-entity-2="Observing" data-source-line="328" data-uid="lnk5" id="link_*start*LinkUp_Observing"><path d="M237.06,366.9038 C237.06,375.7938 237.06,383.7838 237.06,397.2637" fill="none" id="*start*LinkUp-to-Observing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="237.06,403.2637,241.06,394.2637,237.06,398.2637,233.06,394.2637,237.06,403.2637" style="stroke:#181818;stroke-width:1;"/></g><!--link Observing to Configuring--><g class="link" data-entity-1="Observing" data-entity-2="Configuring" data-source-line="341" data-uid="lnk6" id="link_Observing_Configuring"><path d="M145.74,455.3438 C83.6,467.2537 18,490.0538 50.06,531.5938 C63.84,549.4638 108.8506,561.0451 154.0806,568.9951" fill="none" id="Observing-to-Configuring" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="159.99,570.0338,151.8183,564.5361,155.0655,569.1682,150.4334,572.4153,159.99,570.0338" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.2617" x="51.06" y="520.1606">SESSION_OPEN accepted</text></g><!--link Configuring to Observing--><g class="link" data-entity-1="Configuring" data-entity-2="Observing" data-source-line="342" data-uid="lnk7" id="link_Configuring_Observing"><path d="M237.06,549.5538 C237.06,529.4538 237.06,509.1338 237.06,487.7537" fill="none" id="Configuring-to-Observing" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="237.06,481.7537,233.06,490.7537,237.06,486.7537,241.06,490.7537,237.06,481.7537" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="106.2788" x="238.06" y="520.1606">SESSION_CLOSE</text></g><!--link Configuring to Observing--><g class="link" data-entity-1="Configuring" data-entity-2="Observing" data-source-line="343" data-uid="lnk8" id="link_Configuring_Observing"><path d="M314.12,559.5938 C326.78,552.7138 338.28,543.6138 346.06,531.5938 C358.47,512.3938 351.9607,498.9095 332.5707,485.1295" fill="none" id="Configuring-to-Observing-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="327.68,481.6538,332.699,490.1278,331.7556,484.5502,337.3333,483.6069,327.68,481.6538" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.6406" x="352.06" y="512.6606">TM_STATUS.sessionHolder</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="126.1533" x="374.8037" y="527.7935">no longer this node</text></g><ellipse cx="394.5" cy="53.2969" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="351" data-uid="ent0003" id="entity_GMN2"><path d="M577,423.7969 L577,509.4609 L891.7505,509.4609 L891.7505,433.7969 L881.7505,423.7969 L577,423.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M881.7505,423.7969 L881.7505,433.7969 L891.7505,433.7969 L881.7505,423.7969" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="283.6958" x="583" y="440.8638">A stale frame and a missing frame are both</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="272.5303" x="583" y="455.9966">link loss. A task that is alive but no longer</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.7505" x="583" y="471.1294">updating its buffer produces the first and not</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="292.0811" x="583" y="486.2622">the second, which is why TM_STATUS carries</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="254.6934" x="583" y="501.395">state instead of a dedicated heartbeat.</text></g><!--link *start* to LinkDown--><g class="link" data-entity-1="*start*" data-entity-2="LinkDown" data-source-line="319" data-uid="lnk3" id="link_*start*_LinkDown"><path d="M394.5,63.5069 C394.5,76.8669 394.5,96.4269 394.5,118.1969" fill="none" id="*start*-to-LinkDown" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="394.5,124.1969,398.5,115.1969,394.5,119.1969,390.5,115.1969,394.5,124.1969" style="stroke:#181818;stroke-width:1;"/></g><!--link LinkDown to LinkUp--><g class="link" data-entity-1="LinkDown" data-entity-2="LinkUp" data-source-line="346" data-uid="lnk9" id="link_LinkDown_LinkUp"><path d="M239.12,176.4069 C161.28,186.0369 78.54,202.9669 54.5,232.2969 C33.67,257.7069 31.4336,278.5875 44.5036,303.8575" fill="none" id="LinkDown-to-LinkUp" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="47.26,309.1869,46.6783,299.3552,44.963,304.7457,39.5725,303.0304,47.26,309.1869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="171.8945" x="55.5" y="260.3638">valid TM_STATUS received</text></g><!--link LinkUp to LinkDown--><g class="link" data-entity-1="LinkUp" data-entity-2="LinkDown" data-source-line="347" data-uid="lnk10" id="link_LinkUp_LinkDown"><path d="M245.25,309.0969 C247.24,282.0969 253.7,255.3369 267.5,232.2969 C274.57,220.4969 279.626,214.1811 290.806,205.9611" fill="none" id="LinkUp-to-LinkDown" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="295.64,202.4069,286.0195,204.5155,291.6116,205.3687,290.7584,210.9608,295.64,202.4069" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="206.5654" x="268.5" y="252.8638">no valid TM_STATUS for 350 ms</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="97.6143" x="322.9756" y="267.9966">[ICD-FDIR-010]</text></g><!--link LinkUp to LinkDown--><g class="link" data-entity-1="LinkUp" data-entity-2="LinkDown" data-source-line="348" data-uid="lnk11" id="link_LinkUp_LinkDown"><path d="M463.18,309.2169 C469.37,299.5969 474.88,289.6169 479.5,279.2969 C488.04,260.2369 488.55,251.1269 479.5,232.2969 C474.1,221.0569 470.233,215.1629 460.943,206.5629" fill="none" id="LinkUp-to-LinkDown-1" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="456.54,202.4869,460.4272,211.5362,460.2092,205.8835,465.8618,205.6655,456.54,202.4869" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="116.1621" x="524.1416" y="245.3638">TM_STATUS stale,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="191.4453" x="486.5" y="260.4966">counter unchanged 3 periods</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="91.9585" x="536.2434" y="275.6294">[ICD-E2E-050]</text></g><!--link LinkDown to GMN2--><g class="link" data-entity-1="LinkDown" data-entity-2="GMN2" data-source-line="351" data-uid="lnk4" id="link_LinkDown_GMN2"><path d="M549.62,185.0469 C608.51,196.0069 666.3,211.5569 686.5,232.2969 C736.17,283.2869 740.77,371.1669 738.43,423.3469" fill="none" id="LinkDown-GMN2" style="stroke:#181818;stroke-width:1;stroke-dasharray:7.0,7.0;"/></g><!--SRC=[XLF1Zjem4BtdA-ROLXiANN7Xi1A5e4K2GWbxMbR8s1DYaTYHxO1GjV_U2G4Ie5MF7hzvy-RDZ9CkHHWFXlxhTEmFVlhjTWTy6Cbj2xf0CKYbse4jSZHxQQLMO1rp21dZYLG8NtZA2elGwNprlFTl7-3xBp2XdA4-AC-hm9St_FQWVlG0bJD7-0v2sZnbnwfMggq5gOJap56zlsTiKaRGt6YEXDwpj41xYvmmws2doaVr3SmWpCBbfHeAO1PuOGoHUfzDhM_vIUcbdN1Zo-xLrgDWXRg6Ja1el7j0V0AD1OSfPaXw7n1HVnIiesKuNo-2Nq3MPj8v58-uOBcUznVzAIZjRd2VjPI1Lh7S5gOMqupq8D6f8349WYMlAaVlCNMXXoArdjAA-xGe6eUpTJWFPi0unxnARA9k36pa32PX5Fm7kvoII_tbMzGwIt-bNj2ibDAq9cgBXlgIbjmHM4xmElxB4j8WU-NufQYvQ3uSvPw4dX7DZIKuSTzdnDh0SxSDcLsfz_9OHiFnmcztsX__uAXJQKOfFgqKruLofBTGF66aNC1pwRNKui8P_0ZyTfSeFHesmaOxfpFGSNrD0FsA3sB3CWIcQ8KXasGDsNMEcLDgGk3hDRKep