<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Runtime resilience design</title><desc id="d">The converter relaunches itself in the project virtual environment, configures CUDA library paths before process start, uses GPU when available, and falls back to CPU int8 when CUDA fails.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6f4"/><stop offset="1" stop-color="#f7f1e7"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#0E6E63"/></marker></defs><rect width="1200" height="620" rx="32" fill="url(#bg)"/>
<text x="66" y="76" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0E6E63" letter-spacing="2">RUNTIME RESILIENCE</text><text x="66" y="118" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#18252b">Prefer acceleration. Preserve completion.</text>
<g font-family="Arial,sans-serif"><rect x="70" y="185" width="250" height="120" rx="22" fill="#fff" stroke="#d4c6b4"/><text x="95" y="228" font-size="17" font-weight="700" fill="#0E6E63">USER COMMAND</text><text x="95" y="268" font-size="22" font-weight="700" fill="#18252b">python3 converter.py</text>
<rect x="420" y="165" width="330" height="160" rx="22" fill="#fff" stroke="#d4c6b4"/><text x="447" y="208" font-size="17" font-weight="700" fill="#0E6E63">SELF-RELAUNCH</text><text x="447" y="246" font-size="21" font-weight="700" fill="#18252b">venv + LD_LIBRARY_PATH</text><text x="447" y="278" font-size="16" fill="#5f6b68">execv before model libraries load</text>
<rect x="850" y="150" width="280" height="145" rx="22" fill="#173b3e"/><text x="875" y="194" font-size="17" font-weight="700" fill="#bfeee4">FAST PATH</text><text x="875" y="232" font-size="26" font-weight="700" fill="#fff">NVIDIA GPU</text><text x="875" y="264" font-size="16" fill="#d9ece8">large-v3 · float16</text>
<rect x="850" y="365" width="280" height="145" rx="22" fill="#fff" stroke="#d4c6b4"/><text x="875" y="409" font-size="17" font-weight="700" fill="#8A5A12">FALLBACK</text><text x="875" y="447" font-size="26" font-weight="700" fill="#18252b">CPU int8</text><text x="875" y="479" font-size="16" fill="#5f6b68">slower, but result preserved</text>
<rect x="420" y="390" width="330" height="120" rx="22" fill="#fff" stroke="#d4c6b4"/><text x="447" y="433" font-size="17" font-weight="700" fill="#0E6E63">OUTPUT</text><text x="447" y="472" font-size="22" font-weight="700" fill="#18252b">transcript.md + metadata</text></g>
<g stroke="#0E6E63" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M325 245H407"/><path d="M755 235H837"/><path d="M989 302V350"/><path d="M837 438H763"/></g><text x="910" y="335" font-family="Arial,sans-serif" font-size="14" fill="#8A5A12">CUDA / library failure</text>
</svg>