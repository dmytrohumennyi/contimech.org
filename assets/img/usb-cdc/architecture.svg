<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="IBM Plex Sans, Segoe UI, Roboto, Arial, sans-serif">
<title>USB CDC control link: host and device layers (illustrative)</title>
<rect width="960" height="560" fill="#ffffff"/>
<g font-size="12" fill="#5a6072" font-family="IBM Plex Mono, Consolas, monospace" letter-spacing="1">
<text x="40" y="36">HOST · LINUX / WINDOWS</text>
<text x="600" y="36">DEVICE · MICROCONTROLLER</text>
</g>
<g fill="none" stroke="#141a2b" stroke-width="1.2">
<rect x="40" y="52" width="96" height="52"/><rect x="146" y="52" width="96" height="52"/><rect x="252" y="52" width="108" height="52"/>
<rect x="40" y="140" width="320" height="64" stroke="#d39319" stroke-width="2"/>
<rect x="40" y="240" width="320" height="64"/>
<rect x="600" y="240" width="320" height="64"/>
<rect x="600" y="330" width="320" height="64" stroke="#d39319" stroke-width="2"/>
<rect x="600" y="420" width="320" height="52"/>
<rect x="600" y="490" width="150" height="48"/><rect x="770" y="490" width="150" height="48"/>
<rect x="40" y="420" width="320" height="118" stroke="#1f3c96" stroke-dasharray="5 4"/>
</g>
<g font-size="13" fill="#141a2b">
<text x="88" y="83" text-anchor="middle">Terminal</text>
<text x="194" y="76" text-anchor="middle">Python</text><text x="194" y="92" text-anchor="middle">library, CLI</text>
<text x="306" y="76" text-anchor="middle">Test</text><text x="306" y="92" text-anchor="middle">automation</text>
<text x="56" y="166" font-weight="600">Host protocol layer</text>
<text x="56" y="188" fill="#5a6072">COBS framing · CRC-16 · sequence · retry</text>
<text x="56" y="266" font-weight="600">OS class driver: CDC-ACM</text>
<text x="56" y="288" fill="#5a6072">/dev/ttyACM*, COMx · no vendor driver</text>
<text x="616" y="266" font-weight="600">USB device stack: CDC-ACM</text>
<text x="616" y="288" fill="#5a6072">bulk IN / OUT · serial no. from MCU UID</text>
<text x="616" y="356" font-weight="600">Frame decoder</text>
<text x="616" y="378" fill="#5a6072">0x00 delimiter · COBS decode · CRC-16 · SEQ</text>
<text x="616" y="451" font-weight="600">Command dispatcher</text>
<text x="675" y="519" text-anchor="middle">Outputs</text>
<text x="845" y="519" text-anchor="middle">Inputs, measurements</text>
<text x="56" y="446" font-weight="600" fill="#1f3c96">Link supervision</text>
<text x="56" y="470" fill="#5a6072">host: reopen by serial no. after re-enumeration</text>
<text x="56" y="492" fill="#5a6072">device: no valid frame within timeout</text>
<text x="56" y="512" fill="#5a6072">  → defined safe state, reason reported</text>
<text x="56" y="530" fill="#5a6072">  on the next session</text>
</g>
<g stroke="#141a2b" stroke-width="1.2" fill="none">
<path d="M88 104 V122 H306 V104 M194 104 V122 M200 122 V140"/>
<path d="M200 204 V240"/><path d="M760 304 V330"/><path d="M760 394 V420"/><path d="M675 472 V490 M845 472 V490"/>
</g>
<g>
<path d="M360 272 H600" stroke="#141a2b" stroke-width="6"/>
<path d="M360 272 H600" stroke="#ffffff" stroke-width="2"/>
<rect x="404" y="226" width="152" height="30" fill="#ffffff"/>
<text x="480" y="246" text-anchor="middle" font-size="12" font-family="IBM Plex Mono, Consolas, monospace" fill="#141a2b">USB 2.0 full speed</text>
<text x="480" y="300" text-anchor="middle" font-size="12" fill="#5a6072">one cable, byte stream</text>
</g>
<text x="940" y="552" text-anchor="end" font-size="11" fill="#8a8f9c" font-family="IBM Plex Mono, Consolas, monospace">ILLUSTRATIVE · NOT A PRODUCT DIAGRAM</text>
</svg>
