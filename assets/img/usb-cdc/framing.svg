<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="IBM Plex Sans, Segoe UI, Roboto, Arial, sans-serif">
<title>Framing over a CDC byte stream and idempotent retry (illustrative)</title>
<rect width="960" height="600" fill="#ffffff"/>
<text x="40" y="36" font-size="12" fill="#5a6072" font-family="IBM Plex Mono, Consolas, monospace" letter-spacing="1">FRAME ON A BYTE STREAM</text>
<g font-size="13" text-anchor="middle" fill="#141a2b">
<rect x="40" y="52" width="70" height="48" fill="none" stroke="#141a2b"/><text x="75" y="81">VER</text>
<rect x="110" y="52" width="70" height="48" fill="none" stroke="#141a2b"/><text x="145" y="81">SEQ</text>
<rect x="180" y="52" width="70" height="48" fill="none" stroke="#141a2b"/><text x="215" y="81">MSG</text>
<rect x="250" y="52" width="80" height="48" fill="none" stroke="#141a2b"/><text x="290" y="81">FLAGS</text>
<rect x="330" y="52" width="90" height="48" fill="none" stroke="#141a2b"/><text x="375" y="81">LEN (2)</text>
<rect x="420" y="52" width="250" height="48" fill="none" stroke="#141a2b"/><text x="545" y="81">PAYLOAD · 0…256 bytes</text>
<rect x="670" y="52" width="110" height="48" fill="none" stroke="#141a2b"/><text x="725" y="81">CRC-16 (2)</text>
<rect x="780" y="52" width="80" height="48" fill="#f6e7c4" stroke="#d39319" stroke-width="1.5"/><text x="820" y="81">0x00</text>
</g>
<path d="M40 112 H780" stroke="#d39319" stroke-width="1.5"/>
<path d="M40 106 V118 M780 106 V118" stroke="#d39319" stroke-width="1.5"/>
<text x="410" y="134" text-anchor="middle" font-size="12.5" fill="#5a6072">COBS-encoded region: contains no 0x00 byte · overhead ≤ 1 byte per 254</text>
<g font-size="13" fill="#141a2b">
<text x="40" y="172">USB delivers bytes, not messages. The OS may merge or split packets, so the frame boundary has to live in the data.</text>
<text x="40" y="194">After corruption, a lost byte or connecting mid-stream, the receiver drops everything up to the next 0x00 and resynchronises.</text>
</g>
<text x="40" y="250" font-size="12" fill="#5a6072" font-family="IBM Plex Mono, Consolas, monospace" letter-spacing="1">LOST RESPONSE, RETRY WITHOUT DOUBLE EXECUTION</text>
<g font-size="13" fill="#141a2b" text-anchor="middle">
<rect x="150" y="268" width="160" height="36" fill="none" stroke="#141a2b"/><text x="230" y="291">Host</text>
<rect x="650" y="268" width="160" height="36" fill="none" stroke="#1f3c96"/><text x="730" y="291" fill="#1f3c96">Device</text>
</g>
<path d="M230 304 V580 M730 304 V580" stroke="#9aa0ad" stroke-dasharray="4 4"/>
<g stroke="#141a2b" stroke-width="1.3" fill="none">
<path d="M230 340 H724"/><path d="M716 335 L726 340 L716 345"/>
<path d="M730 392 H520"/>
<path d="M230 452 H724"/><path d="M716 447 L726 452 L716 457"/>
<path d="M730 528 H236"/><path d="M244 523 L234 528 L244 533"/>
</g>
<path d="M214 344 V448 M210 344 H218 M210 448 H218" stroke="#5a6072" stroke-width="1.2" fill="none"/>
<path d="M505 382 l20 20 M525 382 l-20 20" stroke="#b4402c" stroke-width="2.5"/>
<g font-size="12.5" fill="#141a2b">
<text x="250" y="332">request · SEQ = n</text>
<text x="745" y="345">execute, store response for n</text>
<text x="545" y="384">response n</text>
<text x="250" y="416" fill="#b4402c">lost on the way</text>
<text x="208" y="400" text-anchor="end" fill="#5a6072">timeout</text>
<text x="250" y="444">same request · SEQ = n (retry)</text>
<text x="745" y="457">SEQ already seen:</text>
<text x="745" y="475">resend stored response,</text>
<text x="745" y="493" font-weight="600">do not execute again</text>
<text x="250" y="520">response n · positive or negative</text>
</g>
<text x="940" y="592" text-anchor="end" font-size="11" fill="#8a8f9c" font-family="IBM Plex Mono, Consolas, monospace">ILLUSTRATIVE REFERENCE · ICD-USB-CTL-001 §5</text>
</svg>
